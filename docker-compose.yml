services:
  postgres:
    image: postgres:18-alpine
    container_name: whoopit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whoopit_admin
      POSTGRES_PASSWORD: whoopit_secure_pw_2026
      POSTGRES_DB: whoopit_inventory_v4
    ports:
      - "5432:5432"
    volumes:
      - whoopit_pgdata:/var/lib/postgresql/data
      - ./backend/db/init-extensions.sql:/docker-entrypoint-initdb.d/00_init_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoopit_admin -d whoopit_inventory_v4"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  valkey:
    image: valkey/valkey:latest
    container_name: whoopit_valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - whoopit_valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whoopit_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - DATABASE_URL=postgres://whoopit_admin:whoopit_secure_pw_2026@postgres:5432/whoopit_inventory_v4?sslmode=disable
      - VALKEY_ADDR=valkey:6379
      - JWT_SECRET=whoopit_jwt_secret_2026_super_secure_auth_token_key_99
      - S3_ENDPOINT=http://storage:9000
      - S3_ACCESS_KEY=any
      - S3_SECRET_KEY=any
      - S3_BUCKET=whoopit-documents

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
        - NEXT_PUBLIC_DEFAULT_TENANT_ID=a0000000-0000-0000-0000-000000000001
    container_name: whoopit_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_DEFAULT_TENANT_ID=a0000000-0000-0000-0000-000000000001

  storage:
    image: chrislusf/seaweedfs:latest
    container_name: whoopit_storage
    restart: unless-stopped
    command: "server -s3 -dir=/data -s3.port=9000 -volume.max=5 -ip=0.0.0.0"
    ports:
      - "9000:9000"
      - "8888:8888"
    volumes:
      - whoopit_storage_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: whoopit_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  clamav:
    image: clamav/clamav:latest
    container_name: whoopit_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"

  pdf-sealer:
    build:
      context: ./backend/services/pdf-sealer
      dockerfile: Dockerfile
    container_name: whoopit_pdf_sealer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  whoopit_pgdata:
    name: whoopit_pgdata
  whoopit_valkeydata:
    name: whoopit_valkeydata
  whoopit_storage_data:
    name: whoopit_storage_data
