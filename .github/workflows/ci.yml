name: CI Pipeline (Quality, Security & Build)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend (Go 1.27 Core API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: whoopit_admin
          POSTGRES_PASSWORD: whoopit_secure_pw_2026
          POSTGRES_DB: whoopit_inventory_v4
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:latest
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: backend
        run: go mod download

      - name: Run Backend Unit & Integration Tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://whoopit_admin:whoopit_secure_pw_2026@localhost:5432/whoopit_inventory_v4?sslmode=disable
          VALKEY_ADDR: localhost:6379
          APP_PORT: 8080
          APP_ENV: test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Go Binary
        working-directory: backend
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/whoopit-api ./cmd/api

  frontend-ci:
    name: Frontend (Next.js 16 App Router)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_DEFAULT_TENANT_ID: a0000000-0000-0000-0000-000000000001
        run: npm run build

  security-scan:
    name: Vulnerability & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'
